<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Recetas Ninja CREAMi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f7f5f0'/><text x='50' y='72' font-size='70' text-anchor='middle' font-family='Georgia,serif' fill='%231f1d1a'>R</text></svg>">
  <!-- Al cambiar CSS o JS, sube el número de ?v= para que los móviles no usen la versión en caché -->
  <link rel="stylesheet" href="style.css?v=20261019e">
  <script>
    // Aplica el tema guardado antes de pintar la página, para que no parpadee
    try {
      const tema = localStorage.getItem("tema");
      if (tema) document.documentElement.dataset.tema = tema;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="cabecera">
    <a href="#" class="titulo">Recetas Ninja CREAMi</a>
    <div class="acciones">
      <button id="lupa" class="icono" aria-label="Buscar receta" title="Buscar receta">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <div class="tema" aria-label="Tema">
        <button class="icono" data-tema="claro" aria-label="Tema claro" title="Tema claro">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icono" data-tema="oscuro" aria-label="Tema oscuro" title="Tema oscuro">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
      </div>
    </div>
    <p class="subtitulo">Helados y sorbetes caseros</p>
  </header>

  <main id="app"></main>

  <script src="recetas.js?v=20261019e"></script>
  <script src="app.js?v=20261019e"></script>
</body>
</html>
